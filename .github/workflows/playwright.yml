name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npx prettier --check .

  test:
    needs: lint
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
            install: 'chromium chromium-headless-shell'
          - project: firefox
            browser: firefox
            install: 'firefox'
          - project: webkit
            browser: webkit
            install: 'webkit'
          - project: 'Mobile Safari'
            browser: webkit
            install: 'webkit'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Кэшируем браузеры по конкретному движку (chromium/firefox/webkit),
      # чтобы Mobile Safari (тоже webkit) переиспользовал тот же кэш, что и webkit
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}

      # Всегда запускаем install (не только при cache miss): если бинарники уже на диске,
      # Playwright сам это определит и пропустит скачивание — быстро. Зато мы не рискуем
      # получить ситуацию, когда какой-то бинарник (например chromium-headless-shell)
      # не попал в кэш и не был доустановлен.
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.install }}
        env:
          # без этого apt может зависнуть на интерактивном промпте needrestart
          DEBIAN_FRONTEND: noninteractive

      - name: Run Playwright tests
        run: npx playwright test --project="${{ matrix.project }}"

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report
          retention-days: 10

      # Каждый браузер сохраняет свои allure-results отдельным артефактом
      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results
          retention-days: 10

  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      # Скачивает все артефакты allure-results-* и кладёт их
      # в одну общую папку allure-results, объединяя результаты
      - name: Download all Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Install Allure CLI
        run: npm install -g allure-commandline --save-dev

      - name: Generate Allure Report
        run: allure generate allure-results --clean -o allure-history

      - name: Deploy Allure to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
